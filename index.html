<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Liko Store | Express Santa Ana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Hero / Main Header -->
    <header class="text-center py-8 px-4">
        <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2">La Liko Store</h1>
        <p class="text-gray-400 text-sm md:text-base">Entrega Rápida a Tu Puerta en Santa Ana</p>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center w-full max-w-lg mx-auto px-4 space-y-6">
        
        <!-- Action Card / Store Info & Map Embed Solution -->
        <div class="bg-gray-800 bg-opacity-50 backdrop-blur-md border border-gray-700 p-6 rounded-2xl w-full shadow-xl space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="bg-blue-600 p-3 rounded-full text-white shadow-md">
                        <i class="fa-solid fa-map-location-dot text-xl"></i>
                    </div>
                    <div class="text-left">
                        <h4 class="font-bold text-base text-white">La Liko Store</h4>
                        <p class="text-xs text-gray-400">Santa Ana, San José</p>
                    </div>
                </div>
                <!-- DIRECT NAVIGATION PIN FALLBACK -->
                <a href="https://maps.google.com/?q=La+Liko+Store+Santa+Ana" target="_blank" rel="noopener noreferrer" class="bg-white text-black text-sm font-bold py-2 px-3 rounded-xl hover:bg-gray-200 transition shadow-lg flex items-center">
                    Abrir <i class="fa-solid fa-arrow-up-right-from-square ml-1.5 text-xs"></i>
                </a>
            </div>

            <!-- Bulletproof Embedded Map Frame targeting exact coordinates so it never defaults to town center -->
            <div class="w-full h-48 rounded-xl overflow-hidden border border-gray-700 relative">
                <iframe 
                    width="100%" 
                    height="100%" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade"
                    src="https://maps.google.com/maps?q=9.9298584,-84.1806162&z=17&output=embed">
                ></iframe>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 border-t border-gray-800 mt-8">
        <p class="text-xs text-gray-500">
            Powered and Engineered by <a href="https://auralinkdigital.com" target="_blank" class="font-bold text-yellow-500 hover:text-yellow-400 transition">Auralinkdigital</a>
        </p>
    </footer>

</body>
</html>
